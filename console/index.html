<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WeKnora MCP 管理</title>
    <link rel="stylesheet" href="/mcp-console/assets/app.css" />
    <script type="module" src="/mcp-console/assets/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand" aria-label="WeKnora MCP 管理">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div>
          <strong>WeKnora</strong>
          <span>MCP 管理</span>
        </div>
      </div>
      <div class="user-actions">
        <span id="current-user" class="current-user">-</span>
        <button id="logout" class="button button-quiet" type="button">退出</button>
      </div>
    </header>

    <main class="workspace">
      <section class="client-column" aria-labelledby="oauth-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">按能力授权 / 全权限</p>
            <h1 id="oauth-title">OAuth 客户端</h1>
          </div>
          <button id="refresh-oauth-clients" class="button button-quiet" type="button">刷新</button>
        </div>
        <div id="oauth-client-list" class="oauth-client-list" aria-busy="true"></div>
        <div id="oauth-empty-state" class="empty-state" hidden>没有可管理的客户端</div>
      </section>

      <aside class="side-column" aria-label="运行状态">
        <section class="panel" aria-labelledby="service-title">
          <div class="panel-heading">
            <h2 id="service-title">服务状态</h2>
            <span id="last-updated" class="muted">-</span>
          </div>
          <div id="service-status" class="service-status"></div>
        </section>

        <section class="panel" aria-labelledby="summary-title">
          <div class="panel-heading">
            <h2 id="summary-title">授权状态</h2>
          </div>
          <dl class="policy-summary">
            <div><dt>已启用</dt><dd id="oauth-enabled-count">-</dd></div>
            <div><dt>活跃会话</dt><dd id="oauth-session-count">-</dd></div>
            <div><dt>知识库范围</dt><dd>按客户端配置</dd></div>
          </dl>
        </section>

        <section class="panel audit-panel" aria-labelledby="audit-title">
          <div class="panel-heading">
            <h2 id="audit-title">变更记录</h2>
          </div>
          <ol id="audit-list" class="audit-list"></ol>
        </section>
      </aside>
    </main>

    <div id="app-status" class="toast" aria-live="polite" hidden></div>

    <dialog id="oauth-confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <h2 id="oauth-confirm-title">确认操作</h2>
        <p id="oauth-confirm-summary"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel">取消</button>
          <button id="oauth-confirm-action" class="button button-danger" value="confirm">确认</button>
        </div>
      </form>
    </dialog>

    <dialog id="oauth-secret-dialog" class="confirm-dialog secret-dialog">
      <form method="dialog">
        <h2>新 Client Secret</h2>
        <p>关闭后页面不会再次显示该密钥。</p>
        <label class="secret-field">
          <span>Client Secret</span>
          <input id="oauth-secret-value" type="text" readonly spellcheck="false" />
        </label>
        <div class="dialog-actions">
          <button id="copy-oauth-secret" class="button button-quiet" type="button">复制</button>
          <button class="button button-primary" value="close">关闭</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
