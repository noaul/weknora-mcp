<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WeKnora MCP 管理</title>
    <link rel="stylesheet" href="/mcp-console/assets/app.css" />
    <script type="module" src="/mcp-console/assets/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar" class="sidebar" aria-label="导航">
        <div class="sidebar-top">
          <div class="brand" aria-label="WeKnora MCP 管理">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span class="brand-text">
              <strong>WeKnora</strong>
              <span>MCP 管理</span>
            </span>
          </div>
          <button id="close-sidebar" class="icon-button sidebar-close" type="button" aria-label="关闭导航">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <nav class="nav" aria-label="页面">
          <button id="nav-overview" class="nav-item" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z" /></svg>
            <span>概览</span>
          </button>
          <p class="nav-label">MCP 客户端</p>
          <div id="oauth-client-list" class="nav-clients" aria-busy="true"></div>
          <div id="oauth-empty-state" class="nav-empty" hidden>没有可管理的客户端</div>
        </nav>

        <div class="sidebar-bottom">
          <div class="account">
            <span id="account-avatar" class="avatar" aria-hidden="true">A</span>
            <span id="current-user" class="current-user">-</span>
          </div>
          <button id="logout" class="button button-ghost button-small" type="button">退出</button>
        </div>
      </aside>
      <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

      <main class="main">
        <header class="main-header">
          <button id="open-sidebar" class="icon-button sidebar-open" type="button" aria-label="打开导航">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <h1 id="view-title">概览</h1>
          <button id="refresh-oauth-clients" class="button button-ghost button-small" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
            <span>刷新</span>
          </button>
        </header>

        <div class="content">
          <section id="overview-view" class="view" aria-labelledby="view-title">
            <div class="stat-grid">
              <div class="stat">
                <span class="stat-label">已启用客户端</span>
                <strong id="oauth-enabled-count">-</strong>
              </div>
              <div class="stat">
                <span class="stat-label">活跃会话</span>
                <strong id="oauth-session-count">-</strong>
              </div>
              <div class="stat">
                <span class="stat-label">知识库范围</span>
                <strong class="stat-text">按客户端配置</strong>
              </div>
            </div>

            <section class="group" aria-labelledby="service-title">
              <div class="group-heading">
                <h2 id="service-title">服务状态</h2>
                <span id="last-updated" class="muted">-</span>
              </div>
              <div id="service-status" class="group-body"></div>
            </section>

            <section class="group" aria-labelledby="clients-title">
              <div class="group-heading">
                <h2 id="clients-title">客户端</h2>
                <span class="muted">按能力授权 / 全权限 · 知识库范围</span>
              </div>
              <div id="overview-clients" class="group-body"></div>
            </section>

            <section class="group" aria-labelledby="audit-title">
              <div class="group-heading">
                <h2 id="audit-title">变更记录</h2>
              </div>
              <ol id="audit-list" class="group-body audit-list"></ol>
            </section>
          </section>

          <section id="client-view" class="view" hidden></section>
        </div>
      </main>
    </div>

    <div id="app-status" class="toast" aria-live="polite" hidden></div>

    <dialog id="oauth-confirm-dialog" class="dialog">
      <form method="dialog">
        <h2 id="oauth-confirm-title">确认操作</h2>
        <p id="oauth-confirm-summary"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">取消</button>
          <button id="oauth-confirm-action" class="button button-primary" value="confirm">确认</button>
        </div>
      </form>
    </dialog>

    <dialog id="oauth-secret-dialog" class="dialog">
      <form method="dialog">
        <h2 id="oauth-secret-title">新 Client Secret</h2>
        <p>关闭后页面不会再次显示，请立即复制保存。</p>
        <label class="secret-field">
          <span id="oauth-secret-label">Client Secret</span>
          <input id="oauth-secret-value" type="text" readonly spellcheck="false" />
        </label>
        <div class="dialog-actions">
          <button id="copy-oauth-secret" class="button button-secondary" type="button">复制</button>
          <button class="button button-primary" value="close">完成</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
