# Install under /opt/1panel/www/sites/wek.uov.me/proxy/ and reload OpenResty.

location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:18194;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:18194;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# RFC 8414 / OIDC path-aware metadata for issuer /oauth/realms/weknora,
# served by the console's embedded OAuth server.
location = /.well-known/oauth-authorization-server/oauth/realms/weknora {
    proxy_pass http://127.0.0.1:18198;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /.well-known/openid-configuration/oauth/realms/weknora {
    proxy_pass http://127.0.0.1:18198;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /mcp {
    proxy_pass http://127.0.0.1:18194;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    add_header X-Accel-Buffering no always;
    client_max_body_size 16m;
}

location = /mcp-console {
    return 308 /mcp-console/;
}

location ^~ /mcp-console/ {
    proxy_pass http://127.0.0.1:18198;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    client_max_body_size 128k;
}

# Authorization, token, JWKS, and revocation endpoints keep the former
# Keycloak realm paths so that configured connectors keep working.
location ^~ /oauth/realms/weknora/ {
    proxy_pass http://127.0.0.1:18198;
    proxy_http_version 1.1;
    # Authorization redirects can carry long state values.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    client_max_body_size 64k;
}
location ^~ /oauth/ {
    return 404;
}
