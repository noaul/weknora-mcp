# Install under /opt/1panel/www/sites/wek.uov.me/proxy/ and reload OpenResty.

location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:18194;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:18194;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# RFC 8414 path-aware metadata aliases for issuer /oauth/realms/weknora.
location = /.well-known/oauth-authorization-server/oauth/realms/weknora {
    proxy_pass http://127.0.0.1:18195/oauth/realms/weknora/.well-known/openid-configuration;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
}

location = /.well-known/openid-configuration/oauth/realms/weknora {
    proxy_pass http://127.0.0.1:18195/oauth/realms/weknora/.well-known/openid-configuration;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
}

location = /mcp {
    proxy_pass http://127.0.0.1:18194;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    add_header X-Accel-Buffering no always;
    client_max_body_size 16m;
}

location = /mcp-console {
    return 308 /mcp-console/;
}

location ^~ /mcp-console/ {
    proxy_pass http://127.0.0.1:18198;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    client_max_body_size 128k;
}

location ^~ /oauth/admin/ {
    return 404;
}

location ^~ /oauth/realms/master/ {
    return 404;
}

location ^~ /oauth/realms/weknora/clients-registrations/ {
    return 404;
}

location ^~ /oauth/realms/weknora/ {
    proxy_pass http://127.0.0.1:18195;
    proxy_http_version 1.1;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
}

location ^~ /oauth/resources/ {
    proxy_pass http://127.0.0.1:18195;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
}
